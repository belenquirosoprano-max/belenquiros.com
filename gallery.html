<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e8"><title>Galería | Belén Quirós</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--paper:#f5f0e8;--ink:#29231f;--wine:#702b3b;--muted:#746b65;--line:#d9cfc4;--white:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif;font-weight:300}.top{height:78px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:500 24px 'Cormorant Garamond',serif;letter-spacing:.07em;color:var(--wine);text-decoration:none}.brand:hover{color:#8b4552}.back{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);text-decoration:none}.back:hover{color:#8b4552}main{padding:70px 7vw 100px}.kicker{font-size:10px;color:var(--wine);letter-spacing:.22em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:35px}.heading h1{font:400 clamp(50px,7vw,84px)/.92 'Cormorant Garamond',serif;margin:18px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.photo{height:410px;position:relative;overflow:hidden;margin:0;background:#d8cec4}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.photo-open{display:block;width:100%;height:100%;cursor:zoom-in}.photo:hover img{transform:scale(1.03)}.photo figcaption{position:absolute;bottom:0;left:0;right:0;padding:30px 18px 14px;color:white;background:linear-gradient(transparent,#201915b5);font:400 18px 'Cormorant Garamond',serif}.quote{min-height:410px;background:var(--wine);color:var(--white);padding:32px;display:flex;flex-direction:column;justify-content:center}.quote blockquote{font:400 28px/1.2 'Cormorant Garamond',serif;margin:0}.quote cite{font:500 9px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.17em;font-style:normal;color:#e7c9bf;margin-top:22px}.empty{color:var(--muted);padding:30px 0}.foot{padding:25px 7vw;border-top:1px solid var(--line);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}@media(max-width:760px){main{padding:55px 5vw 70px}.grid{grid-template-columns:1fr 1fr;gap:10px}.photo,.quote{height:300px;min-height:300px}.quote{padding:20px}.quote blockquote{font-size:22px}.top{padding:0 5vw}.brand{font-size:21px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.photo,.quote{height:380px;min-height:380px}}
p{text-align:justify;text-justify:inter-word}</style></head><body><header class="top"><a class="brand" href="index.html#inicio">BELÉN QUIRÓS</a><a class="back" href="index.html#galeria">← Volver a la galería</a></header><main><div class="heading"><div><span class="kicker">Galería · Belén Quirós</span><h1 id="title">Fotografías</h1></div><span class="kicker" id="count"></span></div><div class="grid" id="grid"></div></main><footer class="foot">© Belén Quirós · Soprano</footer><script>
const data={stage:{title:'Stage',files:['theatre-01.jpg','theatre-03.jpg','theatre-20.jpg','theatre-02.jpg','theatre-05.jpg','theatre-11.jpg','theatre-21.jpg','theatre-07.jpg','theatre-12.jpg','theatre-16.jpg','theatre-14.jpg','theatre-25.jpg','theatre-15.jpg','theatre-19.jpg','theatre-17.jpg','theatre-13.jpg','theatre-22.jpg','theatre-18.jpg','theatre-06.jpg','theatre-23.jpg','theatre-24.jpg','theatre-27.jpg','theatre-26.jpg','theatre-10.jpg','theatre-08.jpg','theatre-09.jpg','theatre-04.jpg'],quotes:[[4,'Cierta gente ve la disciplina como una obligación; para mí, es la estructura que me otorga el orden necesario para echar a volar.','Julie Andrews'],[10,'La elegancia no es hacerse notar, es hacerse recordar; y en el canto, la verdadera elegancia es dejar un eco en el alma del oyente.','Audrey Hepburn']]},portraits:{title:'Portraits',files:['portrait-color.jpg','portrait-16.jpg','portrait-12.jpg','portrait-14.jpg','portrait-09.jpg','portrait-bw.jpg','portrait-15.jpg','portrait-18.jpg','portrait-11.jpg','portrait-17.jpg','portrait-13.jpg'],quotes:[[0,'Una mujer que canta no solo ofrece notas, ofrece su alma, su fuerza y toda la historia que lleva dentro.','María Callas']]},concert:{title:'Concert',files:[...Array.from({length:16},(_,i)=>`concert-${String(i+1).padStart(2,'0')}.jpg`).filter(file=>file!=='concert-02.jpg'),'concert-17.png','concert-18.jpg','concert-19.jpg','concert-20.jpg','concert-21.jpg','concert-22.jpg','concert-23.jpg','concert-24.jpg','concert-25.jpg','concert-26.jpg','concert-27.jpg','concert-28.jpg','concert-29.jpg','concert-30.jpg','concert-32.jpg','concert-31.jpg','concert-33.jpg'],quotes:[[8,'No solo cantamos, además contamos historias.','Aurora Gómez']]}};
const key=new URLSearchParams(location.search).get('category');const album=data[key]||(key==='teatro'?data.stage:null);const grid=document.getElementById('grid');if(album){document.getElementById('title').textContent=album.title;document.getElementById('count').textContent=`${album.files.length} fotografías`;album.files.forEach((file,i)=>{const fig=document.createElement('figure');fig.className='photo';fig.innerHTML=`<a class="photo-open" href="assets/${file}" target="_blank" rel="noreferrer" aria-label="Ver fotografía completa"><img loading="lazy" src="assets/${file}" alt="${album.title} · Belén Quirós"></a><figcaption>${album.title}</figcaption>`;grid.appendChild(fig);const q=album.quotes.find(x=>x[0]===i);if(q){const card=document.createElement('div');card.className='quote';card.innerHTML=`<blockquote>“${q[1]}”</blockquote><cite>— ${q[2]}</cite>`;grid.appendChild(card)}})}else{document.getElementById('title').textContent='Elige una carpeta';document.getElementById('count').textContent='';grid.innerHTML='<p class="empty">Vuelve a la página principal y selecciona Portraits, Concert o Stage.</p>'}
</script></body></html>
