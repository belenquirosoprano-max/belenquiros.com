<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e8">
<title>Actuaciones pasadas · Belén Quirós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f0e8;--card:#eee6dd;--wine:#7a3044;--ink:#292321;--muted:#817a73}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;font-weight:300}.page{max-width:1240px;margin:auto;padding:54px 6vw 80px}.back{display:inline-block;color:var(--wine);font-size:11px;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;border-bottom:1px solid var(--wine);padding-bottom:5px}.eyebrow{margin-top:52px;color:var(--wine);font-size:10px;letter-spacing:.2em;text-transform:uppercase}h1{font:400 clamp(48px,7vw,82px)/.95 'Cormorant Garamond',serif;margin:14px 0 12px}.intro{color:var(--muted);font-size:14px;margin:0 0 34px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,340px));gap:22px;align-items:start}.event-card{width:100%;min-width:0;background:var(--card);border-top:2px solid var(--wine);overflow:hidden}.event-image{display:block;width:100%;aspect-ratio:1/1;height:auto;object-fit:cover}.event-image.poster{object-fit:contain;background:#e9dfc8}.event-image.jaen-image{object-position:center 72%}.event-image.duo-image{object-position:center top}.event-image.ensemble-logo{object-fit:contain;background:#000}.event-image.maestranza-image{object-position:center 60%}.event-image.suor-image{object-position:center 55%}.event-image.convento-image{object-position:center center}.event-content{padding:20px 22px 12px}.event-date{font-size:10px;letter-spacing:.18em;color:var(--wine);text-transform:uppercase}.event-card h3{font:400 29px/1.05 'Cormorant Garamond',serif;margin:15px 0 10px}.event-place{color:var(--muted);font-size:13px;line-height:1.7}.event-type{display:block;padding:0 22px 19px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.photo-credit{display:block;margin-top:10px;font-size:9px;color:var(--muted)}.event-more{display:inline-block;margin:14px 12px 0 0;color:var(--wine);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--wine);padding-bottom:5px;text-decoration:none}.empty{padding:28px;background:var(--card);color:var(--muted);font-size:14px}.empty a{color:var(--wine)}@media(max-width:600px){.page{padding:32px 7vw 60px}.eyebrow{margin-top:40px}.list{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body><main class="page"><a class="back" href="index.html#actuaciones">← Próximas actuaciones</a><p class="eyebrow">Archivo</p><h1>Actuaciones pasadas</h1><p class="intro">Un recuerdo de las funciones y conciertos realizados.</p><div class="list" id="past-list" aria-live="polite"></div><p class="empty" id="empty" hidden>Todavía no hay actuaciones pasadas. <a href="index.html#actuaciones">Consulta las próximas fechas.</a></p><p class="empty" id="error" hidden>No se ha podido cargar el archivo. Vuelve a intentarlo más tarde.</p></main>
<script>
(async()=>{const list=document.getElementById('past-list'),empty=document.getElementById('empty'),error=document.getElementById('error'),now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');try{const response=await fetch('index.html',{cache:'no-cache'});if(!response.ok)throw new Error('Unable to load performances');const source=new DOMParser().parseFromString(await response.text(),'text/html'),cards=[...source.querySelectorAll('.event-card[data-end-date]')].filter(card=>card.dataset.endDate<today).sort((a,b)=>b.dataset.endDate.localeCompare(a.dataset.endDate));cards.forEach(card=>list.appendChild(card.cloneNode(true)));if(!cards.length)empty.hidden=false}catch(e){error.hidden=false}})();
</script></body></html>
